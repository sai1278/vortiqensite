server {
    listen 80;
    server_name vortiqen.site www.vortiqen.site;

    client_max_body_size 10M;

    # Let's Encrypt certificate verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect normal HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name vortiqen.site www.vortiqen.site;

    client_max_body_size 10M;

    # Let's Encrypt SSL certificate
    ssl_certificate /etc/letsencrypt/live/vortiqen.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vortiqen.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
