services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - APP_NAME=Student Project Portal API
      - ENVIRONMENT=production
      - ALLOWED_ORIGINS=https://vortiqen.site,https://www.vortiqen.site
      - LEAD_BACKUP_PATH=data/lead_backup.jsonl
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - backend-data:/app/data
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/vortiqen/certbot/www:/var/www/certbot:ro
      - /opt/vortiqen/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend-data:
