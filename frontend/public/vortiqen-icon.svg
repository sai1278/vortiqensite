<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient matching bg-gradient-to-tr from-blue-700 via-sky-500 to-emerald-400 -->
    <linearGradient id="vq-tile-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Subtle drop shadow matching drop-shadow-md -->
    <filter id="vq-tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Emblem facet gradients -->
    <linearGradient id="vq-left-facet" x1="4" y1="4" x2="12" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="vq-right-facet" x1="20" y1="4" x2="12" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="vq-inner-chevron" x1="12" y1="4.5" x2="12" y2="15.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="vq-spark" x1="10" y1="2.5" x2="14" y2="7.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Tile squircle container matching rounded-2xl -->
  <rect width="40" height="40" rx="12" fill="url(#vq-tile-bg)" />

  <!-- Centered Vortiqen Emblem -->
  <g transform="translate(8, 8)" filter="url(#vq-tile-shadow)">
    <path d="M4.2 4.5C3.8 4.5 3.5 4.8 3.6 5.2L11.5 21C11.7 21.4 12.3 21.4 12.5 21L12.5 15.5L7.8 4.5H4.2Z" fill="url(#vq-left-facet)" />
    <path d="M19.8 4.5C20.2 4.5 20.5 4.8 20.4 5.2L12.5 21C12.3 21.4 11.7 21.4 11.5 21L11.5 15.5L16.2 4.5H19.8Z" fill="url(#vq-right-facet)" />
    <path d="M7.8 4.5L12 15.5L16.2 4.5L12 8.2L7.8 4.5Z" fill="url(#vq-inner-chevron)" />
    <path d="M12 2.2L13.8 4.8L12 7.4L10.2 4.8L12 2.2Z" fill="url(#vq-spark)" />
  </g>
</svg>
